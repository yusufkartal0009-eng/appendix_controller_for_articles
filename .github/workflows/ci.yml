name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint & tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest tests/ -q --cov=src --cov-report=term
      - name: Generate the introduction draft (a build output, not committed; GA-15, #137)
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/generate_academic_introduction_doc.py --output-dir "$RUNNER_TEMP/introduction"
      - name: Upload the introduction draft
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: introduction-docx
          path: ${{ runner.temp }}/introduction/repro_radar_introduction.docx
          if-no-files-found: error
          retention-days: 30

  sandbox-image:
    name: Sandbox image build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -f docker/Dockerfile.sandbox -t repro-radar-sandbox:ci .
      - name: Scientific stack imports and no stray redirect files
        run: |
          docker run --rm --entrypoint python repro-radar-sandbox:ci \
            -c "import numpy, scipy, sklearn, pandas; print(numpy.__version__, scipy.__version__, sklearn.__version__, pandas.__version__)"
          docker run --rm --entrypoint sh repro-radar-sandbox:ci \
            -c 'if ls / | grep "^="; then echo "stray redirect files found"; exit 1; fi'
      - name: Entrypoint reports skipped dependency install
        run: |
          mkdir -p out-skip && chmod 777 out-skip
          docker run --rm -v "$PWD/out-skip:/workspace/output" repro-radar-sandbox:ci python -c "print('ok')"
          cat out-skip/execution_meta.json
          python3 -c "import json; m = json.load(open('out-skip/execution_meta.json')); assert m['status'] == 'COMPLETED' and m['dependency_install_status'] == 'SKIPPED', m"
      - name: Install phase records a failed dependency install
        run: |
          mkdir -p out-fail pkgs deps && chmod 777 out-fail deps
          echo "not a wheel" > pkgs/bogus-0.0.0-py3-none-any.whl
          set +e
          docker run --rm -e SANDBOX_PHASE=install -v "$PWD/out-fail:/workspace/output" \
            -v "$PWD/pkgs:/workspace/packages:ro" -v "$PWD/deps:/workspace/deps:rw" repro-radar-sandbox:ci
          echo "install phase exit code: $?"
          set -e
          cat out-fail/install_meta.json
          python3 -c "import json; m = json.load(open('out-fail/install_meta.json')); assert m['phase'] == 'install' and m['status'] == 'FAILED', m"
      - name: Install phase uses every requirements file
        run: |
          mkdir -p multi-repo multi-out multi-deps multi-pkgs && chmod 777 multi-out multi-deps
          printf 'toolz==0.12.1\n' > multi-repo/requirements.txt
          printf 'ujson==5.10.0\n' > multi-repo/requirements-extra.txt
          python3 -m pip download toolz==0.12.1 --only-binary=:all: --no-deps -d multi-pkgs
          python3 -m pip download ujson==5.10.0 --only-binary=:all: --no-deps -d multi-pkgs \
            --platform manylinux2014_x86_64 --python-version 3.11 --implementation cp
          docker run --rm -e SANDBOX_PHASE=install -v "$PWD/multi-repo:/workspace/repo:ro" \
            -v "$PWD/multi-pkgs:/workspace/packages:ro" -v "$PWD/multi-deps:/workspace/deps:rw" \
            -v "$PWD/multi-out:/workspace/output" repro-radar-sandbox:ci
          cat multi-out/install_meta.json
          ls multi-deps
          test -d multi-deps/toolz
          ls multi-deps | grep -q '^ujson'
      - name: Bundling flags requirements without wheels (real pip download)
        run: |
          mkdir -p bundle-repo
          printf 'toolz==0.12.1\n' > bundle-repo/requirements.txt
          printf 'docopt==0.6.2\n' > bundle-repo/requirements-extra.txt
          echo "print(1)" > bundle-repo/run.py
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, ".")
          from src.sandbox.stager import RepoStager
          stager = RepoStager(staging_root="bundle-stage")
          staged = stager.stage_repository(paper_id="bundle_ci", source="bundle-repo")
          result = stager.bundle_dependencies(staged)
          print(json.dumps({k: result[k] for k in ("status", "requirements_files", "needs_sdist_build")}, indent=2))
          assert sorted(result["requirements_files"]) == ["requirements-extra.txt", "requirements.txt"], result
          assert result["status"] == "PARTIAL", result
          assert [e["requirement"] for e in result["needs_sdist_build"]] == ["docopt==0.6.2"], result
          PY
      - name: OOM kill is reported as OOM_KILLED, a timeout still as TIMEOUT
        run: |
          mkdir -p out-oom out-timeout && chmod 777 out-oom out-timeout
          set +e
          docker run --rm --memory=128m --memory-swap=128m -v "$PWD/out-oom:/workspace/output" repro-radar-sandbox:ci \
            python -c "x = [b'x' * (32 * 1024 * 1024) for _ in range(40)]"
          docker run --rm -e SANDBOX_TIMEOUT=2 -v "$PWD/out-timeout:/workspace/output" repro-radar-sandbox:ci \
            python -c "import time; time.sleep(30)"
          set -e
          cat out-oom/execution_meta.json out-timeout/execution_meta.json
          python3 -c "import json; m = json.load(open('out-oom/execution_meta.json')); assert m['status'] == 'OOM_KILLED' and m['exit_code'] == 137, m"
          python3 -c "import json; m = json.load(open('out-timeout/execution_meta.json')); assert m['status'] == 'TIMEOUT' and m['exit_code'] == 137, m"
      - name: Run phase reports the install status it was given
        run: |
          mkdir -p out-run && chmod 777 out-run
          docker run --rm -e SANDBOX_DEPENDENCY_STATUS=FAILED -v "$PWD/out-run:/workspace/output" \
            repro-radar-sandbox:ci python -c "print('ok')"
          cat out-run/execution_meta.json
          python3 -c "import json; m = json.load(open('out-run/execution_meta.json')); assert m['status'] == 'COMPLETED' and m['dependency_install_status'] == 'FAILED', m"

  corpus:
    name: Corpus verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify seed corpus (paper links, repositories, licenses, pinned scripts)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/verify_corpus.py
      - name: Seed integrity tests (network)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPRO_RADAR_NETWORK_TESTS: "1"
        run: |
          python -m pip install -r requirements-dev.txt
          pytest tests/test_seed_integrity.py -v

  sandbox-acceptance:
    # One run per sandbox image (#158).
    name: Sandbox acceptance (real Docker, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.9", "3.8"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build sandbox image
        run: |
          if [ "${{ matrix.python }}" = "3.11" ]; then TAG=latest; else TAG=py${{ matrix.python }}; fi
          docker build -f docker/Dockerfile.sandbox --build-arg PYTHON_VERSION=${{ matrix.python }} \
            -t repro-radar-sandbox:$TAG .
      - name: Download wheels for the offline install checks (pure Python and compiled)
        run: |
          python -m pip download toolz==0.12.1 --only-binary=:all: --no-deps -d "$RUNNER_TEMP/wheels"
          python -m pip download ujson==5.10.0 --only-binary=:all: --no-deps -d "$RUNNER_TEMP/wheels" \
            --platform manylinux_2_28_x86_64 --platform manylinux2014_x86_64 \
            --python-version ${{ matrix.python }} --implementation cp
          ls -l "$RUNNER_TEMP/wheels"
      - name: Install project requirements
        run: python -m pip install -r requirements.txt
      - name: Run acceptance checks through DockerSandboxRunner
        run: python scripts/sandbox_acceptance.py --wheel-dir "$RUNNER_TEMP/wheels" --python-version ${{ matrix.python }}
