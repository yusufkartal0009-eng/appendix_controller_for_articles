name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint & tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest tests/ -q --cov=src --cov-report=term

  sandbox-image:
    name: Sandbox image build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -f docker/Dockerfile.sandbox -t repro-radar-sandbox:ci .
      - name: Scientific stack imports and no stray redirect files
        run: |
          docker run --rm --entrypoint python repro-radar-sandbox:ci \
            -c "import numpy, scipy, sklearn, pandas; print(numpy.__version__, scipy.__version__, sklearn.__version__, pandas.__version__)"
          docker run --rm --entrypoint sh repro-radar-sandbox:ci \
            -c 'if ls / | grep "^="; then echo "stray redirect files found"; exit 1; fi'
      - name: Entrypoint reports skipped dependency install
        run: |
          mkdir -p out-skip && chmod 777 out-skip
          docker run --rm -v "$PWD/out-skip:/workspace/output" repro-radar-sandbox:ci python -c "print('ok')"
          cat out-skip/execution_meta.json
          python3 -c "import json; m = json.load(open('out-skip/execution_meta.json')); assert m['status'] == 'COMPLETED' and m['dependency_install_status'] == 'SKIPPED', m"
      - name: Install phase records a failed dependency install
        run: |
          mkdir -p out-fail pkgs deps && chmod 777 out-fail deps
          echo "not a wheel" > pkgs/bogus-0.0.0-py3-none-any.whl
          set +e
          docker run --rm -e SANDBOX_PHASE=install -v "$PWD/out-fail:/workspace/output" \
            -v "$PWD/pkgs:/workspace/packages:ro" -v "$PWD/deps:/workspace/deps:rw" repro-radar-sandbox:ci
          echo "install phase exit code: $?"
          set -e
          cat out-fail/install_meta.json
          python3 -c "import json; m = json.load(open('out-fail/install_meta.json')); assert m['phase'] == 'install' and m['status'] == 'FAILED', m"
      - name: Run phase reports the install status it was given
        run: |
          mkdir -p out-run && chmod 777 out-run
          docker run --rm -e SANDBOX_DEPENDENCY_STATUS=FAILED -v "$PWD/out-run:/workspace/output" \
            repro-radar-sandbox:ci python -c "print('ok')"
          cat out-run/execution_meta.json
          python3 -c "import json; m = json.load(open('out-run/execution_meta.json')); assert m['status'] == 'COMPLETED' and m['dependency_install_status'] == 'FAILED', m"

  corpus:
    name: Corpus verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify seed corpus (paper links, repositories, licenses, pinned scripts)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/verify_corpus.py
      - name: Seed integrity tests (network)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPRO_RADAR_NETWORK_TESTS: "1"
        run: |
          python -m pip install -r requirements-dev.txt
          pytest tests/test_seed_integrity.py -v

  sandbox-acceptance:
    name: Sandbox acceptance (real Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build sandbox image
        run: docker build -f docker/Dockerfile.sandbox -t repro-radar-sandbox:latest .
      - name: Download wheels for the offline install checks (pure Python and compiled)
        run: |
          python -m pip download toolz==0.12.1 --only-binary=:all: --no-deps -d "$RUNNER_TEMP/wheels"
          python -m pip download ujson==5.10.0 --only-binary=:all: --no-deps -d "$RUNNER_TEMP/wheels" \
            --platform manylinux_2_28_x86_64 --platform manylinux2014_x86_64 --python-version 3.11 --implementation cp
          ls -l "$RUNNER_TEMP/wheels"
      - name: Run acceptance checks through DockerSandboxRunner
        run: python scripts/sandbox_acceptance.py --wheel-dir "$RUNNER_TEMP/wheels"
