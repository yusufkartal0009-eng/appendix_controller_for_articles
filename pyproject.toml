[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# CI correctness gate: syntax errors, undefined names, invalid escape sequences, and shell=True.
# Style rules are enabled incrementally as the lint backlog (docs/gap_analysis.md, G11) is cleared.
select = ["E9", "F63", "F7", "F82", "W605", "S602"]
