[project]
name = "repro-radar"
dynamic = ["version"]
# scripts/fetch_data.py unpacks tar archives with extractall(filter="data"), which exists from 3.11.4 (#252).
requires-python = ">=3.11.4"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# CI lint gate: ruff's default rule set (GA-11, #139) plus the rules of the first correctness gate
# (syntax errors, undefined names, invalid escape sequences, and shell=True).
extend-select = ["E9", "F63", "F7", "F82", "W605", "S602"]
